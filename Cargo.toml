[workspace]
resolver = "2"
members = [
    "crates/math",
    "crates/scene",
    "crates/assets",
    "crates/gpu",
    "crates/render",
    "crates/overlay",
    "crates/app",
    "crates/loader",
    "crates/import",
    "crates/anim",
    "tools/gen_test_textures",
    "examples/hello_triangle",
    "examples/triangle_scenegraph",
    "examples/mesh_showcase",
    "examples/multi_object",
    "examples/offscreen_demo",
    "examples/platonic_solids",
    "examples/skeleton_demo",
    "examples/trackball_demo",
    "examples/textured_mesh",
    "examples/lit_scene",
    "examples/metaballs",
    "examples/voice_metaballs",
    "examples/obj_load",
    "examples/obj_textured",
    "examples/multi_obj",
    "examples/texture_load",
    "examples/texture_formats",
    "examples/shader_load",
    "examples/asset_showcase",
    "examples/model_gallery",
]
exclude = ["GeometricTools"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
rig-math = { path = "crates/math" }
rig-assets = { path = "crates/assets" }
rig-scene = { path = "crates/scene" }
rig-gpu = { path = "crates/gpu" }
rig-render = { path = "crates/render" }
rig-overlay = { path = "crates/overlay" }
rig-app = { path = "crates/app" }
rig-loader = { path = "crates/loader" }
rig-import = { path = "crates/import" }
rig-anim = { path = "crates/anim" }

# External dependencies
wgpu = "29.0.1"
winit = "0.30.8"
glam = { version = "0.32.1", features = ["bytemuck"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
thiserror = "2.0"
anyhow = "1.0"
image = "0.25"
tobj = "4"
