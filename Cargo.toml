[workspace]
resolver = "2"
members = [
    "crates/*",
    "tools/*",
    "examples/shared",
    "examples/basics/*",
    "examples/geometry/*",
    "examples/techniques/*",
    "examples/materials/*",
    "examples/loading/*",
    "examples/animation/*",
    "examples/terrain/*",
    "examples/gltf/*",
    "examples/procedural/*",
]
default-members = ["crates/*", "tools/*"]
exclude = ["GeometricTools", "vendor"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
rig-math = { path = "crates/math" }
rig-assets = { path = "crates/assets" }
rig-scene = { path = "crates/scene" }
rig-gpu = { path = "crates/gpu" }
rig-render = { path = "crates/render" }
rig-overlay = { path = "crates/overlay" }
rig-app = { path = "crates/app" }
rig-loader = { path = "crates/loader" }
rig-import = { path = "crates/import" }
rig-anim = { path = "crates/anim" }
rig-skin = { path = "crates/skin" }
rig-gltf = { path = "crates/gltf" }
example-shared = { path = "examples/shared" }

# External dependencies
wgpu = "29.0.1"
winit = "0.30.8"
glam = { version = "0.32.1", features = ["bytemuck"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
thiserror = "2.0"
anyhow = "1.0"
image = "0.25"
tobj = "4"
mikktspace = "0.3"
noise = "0.9"
gltf = { version = "1.4", features = ["KHR_lights_punctual"] }
